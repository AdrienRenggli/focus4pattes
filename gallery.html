<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Focus4pattes | Galerie</title>
        <link rel="shortcut icon" href="res/layout/favicon.ico" type="image/x-icon">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="css/header-footer.css" />
        <link rel="stylesheet" href="css/gallery.css" /> 
        <link rel="stylesheet" href="css/components/topButton.css">
    </head>

    <body>
        <header id="main-header" class="header"></header>
    
        <h1 data-i18n="nav-gallery" class="page-title">Galerie photos</h1>

        <!-- Category Filters -->
        <section class="category-grid">
            <a href="gallery.html?category=dogs" class="cat-item">
                <img src="res/home/dog.svg" alt="Chiens">
                <span data-i18n="cat_dogs">CHIENS</span>
            </a>
            <a href="gallery.html?category=cats" class="cat-item">
                <img src="res/home/cat.svg" alt="Chats">
                <span data-i18n="cat_cats">CHATS</span>
            </a>
            <a href="gallery.html?category=horses" class="cat-item">
                <img src="res/home/horse.svg" alt="Chevaux">
                <span data-i18n="cat_horses">CHEVAUX</span>
            </a>
            <a href="gallery.html?category=farm" class="cat-item">
                <img src="res/home/farm.svg" alt="Animaux de ferme">
                <span data-i18n="cat_farm">ANIMAUX DE FERME</span>
            </a>
            <a href="gallery.html?category=all" class="cat-item" id="filter-all" title="Effacer le filtre">
                <i class="fa-solid fa-x"></i>
            </a>
        </section> 

        <!-- Masonry Gallery Container -->
        <main id="masonry-gallery" class="masonry-grid"></main>

        <!-- Fullscreen Carousel Modal -->
        <div id="carousel-modal" class="modal hidden">
            <button id="modal-close" class="modal-btn close">&times;</button>
            <div class="carousel-container">
                <button id="carousel-prev" class="modal-btn prev">&#10094;</button>
                <img id="carousel-image" src="" alt="Photographie d'animal">
                <button id="carousel-next" class="modal-btn next">&#10095;</button>
            </div>
            <div class="carousel-caption">
                <h3 id="carousel-title"></h3>
                <p id="carousel-description"></p>
            </div>
        </div>

        <button id="backToTopBtn" title="Retour en haut"><i class="fa-solid fa-arrow-up"></i></button>

        <footer id="main-footer" class="main-footer"></footer>

        <script src="js/i18n.js"></script>
        <script src="js/main.js"></script>
        <script src="js/load-components.js"></script>
        <script src="js/reveal.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>

        <script src="data/galleryContent.js"></script>
        <script type="module" src="js/gallery.js"></script> 
    </body>
</html>
